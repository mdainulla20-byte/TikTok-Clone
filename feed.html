<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Clone - Feed</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="feed-body">

    <!-- Video Feed Container -->
    <div class="video-container">
        
        <!-- Single Video Card -->
        <div class="video-card">
            <video class="video-player" src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay muted></video>
            
            <!-- Side Action Buttons (Like, Comment, Share, Profile) -->
            <div class="side-bar">
                <div class="icon profile-icon">
                    <img src="https://via.placeholder.com/50" id="user-avatar" alt="Profile">
                    <span class="follow-btn">+</span>
                </div>
                <div class="icon">
                    <i class="fas fa-heart"></i>
                    <span>১.২কে</span>
                </div>
                <div class="icon">
                    <i class="fas fa-comment-dots"></i>
                    <span>৪৫০</span>
                </div>
                <div class="icon">
                    <i class="fas fa-share"></i>
                    <span>শেয়ার</span>
                </div>
            </div>

            <!-- Bottom Information -->
            <div class="video-info">
                <h3>@user_name</h3>
                <p>আমার প্রথম ভিডিও! #tiktokclone #viral</p>
                <div class="music-info">
                    <i class="fas fa-music"></i> <span>অরিজিনাল সাউন্ড - User</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="feed.html" class="active"><i class="fas fa-home"></i><span>হোম</span></a>
        <a href="#"><i class="fas fa-compass"></i><span>ডিসকভার</span></a>
        <a href="#" class="upload-btn"><i class="fas fa-plus"></i></a>
        <a href="#"><i class="fas fa-comment-alt"></i><span>ইনবক্স</span></a>
        <a href="profile.html"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
    </div>

</body>
          </html>
