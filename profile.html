<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Clone - Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="profile-body">

    <!-- Profile Header Section -->
    <div class="profile-header">
        <div class="profile-avatar">
            <img src="https://via.placeholder.com/100" id="profile-img" alt="Profile Picture">
        </div>
        <h3 class="profile-username">@user_name</h3>
        
        <!-- Stats Section -->
        <div class="profile-stats">
            <div class="stat-item">
                <span class="stat-count">১২২</span>
                <span class="stat-label">ফলোয়িং</span>
            </div>
            <div class="stat-item">
                <span class="stat-count">১.৫কে</span>
                <span class="stat-label">ফলোয়ার</span>
            </div>
            <div class="stat-item">
                <span class="stat-count">২৪.৫কে</span>
                <span class="stat-label">লাইক</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="profile-actions">
            <button class="edit-profile-btn">প্রোফাইল এডিট</button>
            <button class="share-profile-btn"><i class="fas fa-share"></i></button>
        </div>

        <p class="profile-bio">স্বাগতম আমার প্রফাইলে! 🎬 | Content Creator</p>
    </div>

    <!-- User Videos Grid Tab -->
    <div class="profile-tabs">
        <div class="tab active"><i class="fas fa-th"></i></div>
        <div class="tab"><i class="fas fa-heart"></i></div>
        <div class="tab"><i class="fas fa-lock"></i></div>
    </div>

    <!-- Videos Grid -->
    <div class="video-grid">
        <div class="grid-item">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted></video>
            <span class="views"><i class="fas fa-play"></i> ১.২কে</span>
        </div>
        <div class="grid-item">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted></video>
            <span class="views"><i class="fas fa-play"></i> ৫৫০</span>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="feed.html"><i class="fas fa-home"></i><span>হোম</span></a>
        <a href="#"><i class="fas fa-compass"></i><span>ডিসকভার</span></a>
        <a href="upload.html" class="upload-btn"><i class="fas fa-plus"></i></a>
        <a href="#"><i class="fas fa-comment-alt"></i><span>ইনবক্স</span></a>
        <a href="profile.html" class="active"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
    </div>

</body>
              </html>
